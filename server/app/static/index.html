<script>
/* Chrome's "Desktop site" lays the page out 980px wide and shrinks it. On a phone, scale it back
   up so the app always shows its phone layout. */
(function () {
  function fit() {
    try {
      var de = document.documentElement, sw = Math.min(screen.width, window.outerWidth || screen.width);
      de.style.zoom = "";
      var touch = matchMedia("(pointer: coarse)").matches || "ontouchstart" in window;
      if (touch && sw > 0 && sw < 820 && window.innerWidth > sw * 1.3) de.style.zoom = (window.innerWidth / sw).toFixed(3);
    } catch (e) {}
  }
  fit(); addEventListener("resize", fit); addEventListener("orientationchange", function () { setTimeout(fit, 300); });
})();
</script>
