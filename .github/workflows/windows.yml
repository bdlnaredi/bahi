name: Windows app

on:
  push:
    branches: [main]
    paths: ["windows/**", "agent/**", "docs/BahiSync.txt", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build BahiSync.exe
        shell: pwsh
        run: |
          $n = "${{ github.run_number }}"
          Set-Content windows/BuildInfo.cs "namespace BahiSync { static class BuildInfo { public const int Number = $n; public const string Version = `"1.$n`"; } }"
          # the C# compiler that comes with Windows (.NET Framework 4), so nothing is downloaded
          $csc = Join-Path $env:WINDIR "Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $res = @()
          foreach ($f in "TallySync.ps1", "Diagnose.ps1", "Save-Voucher.ps1", "Save-Stock.ps1") { $res += "/resource:agent\$f,$f" }
          & $csc /nologo /target:winexe /optimize+ /out:BahiSync.exe /win32icon:windows\bahi.ico `
            /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Web.Extensions.dll `
            @res windows\*.cs
          if ($LASTEXITCODE -ne 0) { throw "compile failed" }
          Get-Item BahiSync.exe | Format-List Name, Length

      - name: Smoke test (starts, puts the sync files out, stays up)
        shell: pwsh
        run: |
          New-Item -ItemType Directory t | Out-Null
          Copy-Item BahiSync.exe t\
          $p = Start-Process -FilePath (Resolve-Path t\BahiSync.exe) -ArgumentList "--tray" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "BahiSync.exe exited by itself (code $($p.ExitCode))" }
          Get-ChildItem t | Format-Table Name, Length
          foreach ($f in "TallySync.ps1", "Diagnose.ps1", "Save-Voucher.ps1", "Save-Stock.ps1") { if (-not (Test-Path "t\$f")) { throw "$f was not put out" } }
          Stop-Process -Id $p.Id -Force

      - name: Screenshots (settings on first start, then the main window)
        continue-on-error: true
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots\$name.png"); $g.Dispose(); $bmp.Dispose()
          }
          New-Item -ItemType Directory shots, s1, s2 | Out-Null
          Copy-Item BahiSync.exe s1\; Copy-Item BahiSync.exe s2\
          $p = Start-Process -FilePath (Resolve-Path s1\BahiSync.exe) -PassThru; Start-Sleep -Seconds 6; Shot "1-first-start"; Stop-Process -Id $p.Id -Force
          '{"ServerUrl":"https://books.example.com","SyncToken":"x","TallyUrl":"http://localhost:9000","FromDate":"2023-04-01"}' | Set-Content s2\TallySync.config.json
          "2026-10-26 18:54:15  Syncing Demo Traders - changed months: 2026-10 ...`r`n2026-10-26 18:56:09  Done: 312 ledgers, 40 stock items, 9120 vouchers in 61 s" | Set-Content s2\TallySync.log
          $p = Start-Process -FilePath (Resolve-Path s2\BahiSync.exe) -PassThru; Start-Sleep -Seconds 12; Shot "2-main"; Stop-Process -Id $p.Id -Force

      - name: Build the installer (BahiSync-Setup.exe)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command iscc.exe -ErrorAction Stop).Source }
          $env:BAHI_VERSION = "1.${{ github.run_number }}"
          & $iscc /Q windows\BahiSync.iss
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }
          Get-Item out\BahiSync-Setup.exe | Format-List Name, Length

      - name: Installer test (Program Files, settings brought over from the old folder, uninstall)
        shell: pwsh
        run: |
          New-Item -ItemType Directory shots -Force | Out-Null
          $out = "shots\installer-test.txt"; $fail = @()
          function Note($t) { Add-Content $out $t; Write-Host ("::warning::" + ($t -replace "`r|`n", " ")) }
          New-Item -ItemType Directory C:\Bahi -Force | Out-Null
          '{"ServerUrl":"https://books.example.com","SyncToken":"x","TallyUrl":"http://localhost:9000","FromDate":"2023-04-01","Companies":{"Demo Traders":{"Sync":true},"Demo Traders (2023-24)":{"Sync":false,"From":"2023-04-01"}}}' | Set-Content C:\Bahi\TallySync.config.json
          "test-uid" | Set-Content C:\Bahi\TallySync.sent
          '[{"Name":"Demo Traders","BooksFrom":"2023-04-01","LastOpen":"2026-10-30 18:00"},{"Name":"Demo Traders (2023-24)","BooksFrom":"2023-04-01","LastOpen":"2026-09-01 10:00"},{"Name":"Sample Shop","BooksFrom":"2025-04-01","LastOpen":"2026-10-30 18:00"}]' | Set-Content C:\Bahi\TallySync.companies.json
          Set-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Run BahiSync '"C:\Bahi\BahiSync.exe" --tray'
          Note "test started"
          $p = Start-Process out\BahiSync-Setup.exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=setup.log" -PassThru -Wait
          Note "setup exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { $fail += "setup"; Get-Content setup.log -Tail 40 | ForEach-Object { Note $_ } }
          $app = "$env:ProgramFiles\Bahi Sync"
          Start-Sleep -Seconds 15
          Note ("files: " + ((Get-ChildItem $app -ErrorAction SilentlyContinue | ForEach-Object Name) -join ", "))
          foreach ($f in "BahiSync.exe", "TallySync.ps1", "Diagnose.ps1", "Save-Voucher.ps1", "Save-Stock.ps1", "Read me.txt", "TallySync.config.json", "TallySync.sent", "TallySync.companies.json") {
            if (-not (Test-Path "$app\$f")) { $fail += "$f missing" }
          }
          $run = (Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Run -ErrorAction SilentlyContinue).BahiSync
          Note "start with Windows: $run"
          if ($run -notlike "*Bahi Sync\BahiSync.exe*") { $fail += "run key" }
          Note ("running: " + ((Get-Process BahiSync -ErrorAction SilentlyContinue | ForEach-Object Path) -join ", "))
          if (-not (Get-Process BahiSync -ErrorAction SilentlyContinue)) { $fail += "not started" }
          if (Test-Path "$app\TallySync.log") { Get-Content "$app\TallySync.log" -Tail 5 | ForEach-Object { Note "log: $_" } }
          (Get-Acl $app -ErrorAction SilentlyContinue).Access | ForEach-Object { Note "acl: $($_.IdentityReference) $($_.FileSystemRights)" }
          # the companies window, for the screenshots
          Get-Process BahiSync -ErrorAction SilentlyContinue | Stop-Process -Force; Start-Sleep -Seconds 2
          if (Test-Path "$app\BahiSync.exe") {
            $p = Start-Process -FilePath "$app\BahiSync.exe" -ArgumentList "--companies" -PassThru; Start-Sleep -Seconds 12
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots\3-companies.png"); $g.Dispose(); $bmp.Dispose()
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path "$app\unins000.exe") {
            $u = Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -PassThru -Wait
            Start-Sleep -Seconds 5
            if (Test-Path "$app\BahiSync.exe") { $fail += "uninstall left BahiSync.exe" }
            if ((Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Run -ErrorAction SilentlyContinue).BahiSync) { $fail += "uninstall left run key" }
            Note ("after uninstall: " + ((Get-ChildItem $app -ErrorAction SilentlyContinue | ForEach-Object Name) -join ", "))
          } else { $fail += "no uninstaller" }
          Note ("FAILED: " + ($fail -join "; "))
          if ($fail.Count) { exit 1 }

      - name: Keep the screenshots on a draft release (not shown publicly)
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ci-screenshots *> $null
          if ($LASTEXITCODE -ne 0) { gh release create ci-screenshots --draft --title "CI screenshots" --notes "Screenshots from the Windows build, for checking the layout." }
          foreach ($f in Get-ChildItem shots) { gh release upload ci-screenshots $f.FullName --clobber; if ($LASTEXITCODE) { Write-Host "::warning::upload of $($f.Name) failed" } }

      - uses: actions/upload-artifact@v4
        with:
          name: BahiSync
          path: |
            BahiSync.exe
            out/BahiSync-Setup.exe

      - name: Publish to the "windows" release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "Bahi Sync for the Tally PC, version 1.${{ github.run_number }}.`n`nBahiSync-Setup.exe installs it in Program Files with everything it needs (Start menu shortcut, uninstaller) and brings your settings over from an earlier copy. BahiSync.exe is the same app without installing, for running from any folder.`n`nversionCode: ${{ github.run_number }}"
          gh release view windows *> $null
          if ($LASTEXITCODE -eq 0) { gh release edit windows --title "Windows app 1.${{ github.run_number }}" --notes $notes }
          else { gh release create windows --title "Windows app 1.${{ github.run_number }}" --notes $notes --latest=false }
          gh release upload windows BahiSync.exe out\BahiSync-Setup.exe --clobber
