name: Windows app

on:
  push:
    branches: [main]
    paths: ["windows/**", "agent/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build BahiSync.exe
        shell: pwsh
        run: |
          $n = "${{ github.run_number }}"
          Set-Content windows/BuildInfo.cs "namespace BahiSync { static class BuildInfo { public const int Number = $n; public const string Version = `"1.$n`"; } }"
          # the C# compiler that comes with Windows (.NET Framework 4), so nothing is downloaded
          $csc = Join-Path $env:WINDIR "Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $res = @()
          foreach ($f in "TallySync.ps1", "Diagnose.ps1", "Save-Voucher.ps1", "Save-Stock.ps1") { $res += "/resource:agent\$f,$f" }
          & $csc /nologo /target:winexe /optimize+ /out:BahiSync.exe /win32icon:windows\bahi.ico `
            /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Web.Extensions.dll `
            @res windows\*.cs
          if ($LASTEXITCODE -ne 0) { throw "compile failed" }
          Get-Item BahiSync.exe | Format-List Name, Length

      - name: Smoke test (starts, puts the sync files out, stays up)
        shell: pwsh
        run: |
          New-Item -ItemType Directory t | Out-Null
          Copy-Item BahiSync.exe t\
          $p = Start-Process -FilePath (Resolve-Path t\BahiSync.exe) -ArgumentList "--tray" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "BahiSync.exe exited by itself (code $($p.ExitCode))" }
          Get-ChildItem t | Format-Table Name, Length
          foreach ($f in "TallySync.ps1", "Diagnose.ps1", "Save-Voucher.ps1", "Save-Stock.ps1") { if (-not (Test-Path "t\$f")) { throw "$f was not put out" } }
          Stop-Process -Id $p.Id -Force

      - name: Screenshots (settings on first start, then the main window)
        continue-on-error: true
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots\$name.png"); $g.Dispose(); $bmp.Dispose()
          }
          New-Item -ItemType Directory shots, s1, s2 | Out-Null
          Copy-Item BahiSync.exe s1\; Copy-Item BahiSync.exe s2\
          $p = Start-Process -FilePath (Resolve-Path s1\BahiSync.exe) -PassThru; Start-Sleep -Seconds 6; Shot "1-first-start"; Stop-Process -Id $p.Id -Force
          '{"ServerUrl":"https://books.example.com","SyncToken":"x","TallyUrl":"http://localhost:9000","FromDate":"2023-04-01"}' | Set-Content s2\TallySync.config.json
          "2026-10-26 18:54:15  Syncing SHIV SHAKTI BHANDAR - changed months: 2026-10 ...`r`n2026-10-26 18:56:09  Done: 659 ledgers, 11 stock items, 38095 vouchers in 500 s" | Set-Content s2\TallySync.log
          $p = Start-Process -FilePath (Resolve-Path s2\BahiSync.exe) -PassThru; Start-Sleep -Seconds 12; Shot "2-main"; Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: screenshots
          path: shots/

      - uses: actions/upload-artifact@v4
        with:
          name: BahiSync
          path: BahiSync.exe

      - name: Publish to the "windows" release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "Bahi Sync for the Tally PC, version 1.${{ github.run_number }}. Download BahiSync.exe into the Bahi folder (for example C:\Bahi) and run it.`n`nversionCode: ${{ github.run_number }}"
          gh release view windows *> $null
          if ($LASTEXITCODE -eq 0) { gh release edit windows --title "Windows app 1.${{ github.run_number }}" --notes $notes }
          else { gh release create windows --title "Windows app 1.${{ github.run_number }}" --notes $notes --latest=false }
          gh release upload windows BahiSync.exe --clobber
